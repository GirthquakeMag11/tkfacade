name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev xvfb

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install mpv

      # Windows needs no system step: the Git-LFS-vendored
      # src/tkfacade/media/libmpv DLLs serve the editable install.

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.12"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run ruff
        run: uv run ruff check src tests

      - name: Run mypy
        run: uv run mypy src

      - name: Run tests (Linux, full suite on virtual display)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run uv run pytest -q

      # macOS runners have no window server and no Xvfb equivalent, so any
      # test that opens a window segfaults in TkpInit. The macOS job runs
      # the non-GUI subset; the full suite is required on Linux+Windows.
      - name: Run tests (macOS, non-GUI subset)
        if: matrix.os == 'macos-latest'
        run: uv run pytest -q -m "not gui"

      # Known Windows-only crashes are deselected explicitly and tracked as
      # GitHub issues; the list shrinks as fixes land (ROADMAP theme T2).
      # TEMPORARY: -v to identify the crashing test; revert to -q after.
      - name: Run tests (Windows, full suite minus known crashes)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          ARGS=$(grep -v '^#' .github/ci/windows-deselect.txt | sed '/^$/d; s/^/--deselect /' | tr '\n' ' ')
          uv run pytest -v $ARGS
