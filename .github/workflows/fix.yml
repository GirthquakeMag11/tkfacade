# Fix agent (SPEC.md section 5).
#
# Dispatched per-issue by the triage agent (workflow_dispatch), by a
# maintainer, or by the nightly batch. The concurrency group serializes
# runs — a stricter budget than the SPEC's cap of 3 concurrent; displaced
# pending runs are recovered by the nightly batch, which re-lists every
# ready-to-fix issue without an open PR.

name: Fix

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to fix (leave empty for a ready-to-fix batch)"
        required: false
        type: string
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: fix-agent
  cancel-in-progress: false

env:
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  OPENCODE_MODEL: openrouter/qwen/qwen3.8-max-0902

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev xvfb

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.12"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Install opencode
        run: npm install -g opencode-ai@1.18.30

      - name: Configure git identity
        run: |
          git config user.name "tkfacade fix agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run fix agent
        run: |
          if [ -n "${{ inputs.issue }}" ]; then
            MODE="MODE ISSUE ${{ inputs.issue }}"
          else
            MODE="MODE BATCH"
          fi
          PROMPT="$(cat .github/prompts/fix.md)

          ---
          ${MODE}"
          opencode run --auto -m "$OPENCODE_MODEL" "$PROMPT"
